name: Daily learning

# Every trading day after the close, re-test the rules on the latest data and
# update rules.json, which the app uses. A change is adopted only if it made money
# after charges in both halves of the test period on enough trades (tools/learn.php).
# The decision log is kept in rules.json and shown on the Intraday page.
# The studies run one after another (not in parallel) so the data provider does not
# throttle them; a study that loads under 90% of the stocks publishes nothing.

on:
  schedule:
    - cron: '40 10 * * 1-5'   # 16:10 IST, after the close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learn
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: study-data-${{ github.run_id }}-${{ github.job }}
          restore-keys: study-data-
      - run: php tools/volume-study.php 260 0 1 grid | tee intraday.jsonl
      - uses: actions/upload-artifact@v4
        with: { name: intraday, path: intraday.jsonl }
  swing:
    needs: [intraday]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: study-data-${{ github.run_id }}-${{ github.job }}
          restore-keys: study-data-
      - run: php tools/swing-study.php 260 3 | tee swing.jsonl
      - uses: actions/upload-artifact@v4
        with: { name: swing, path: swing.jsonl }
  lab:
    needs: [swing]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: study-data-${{ github.run_id }}-${{ github.job }}
          restore-keys: study-data-
      - run: php tools/strategy-lab.php 260 4 | tee lab.jsonl
      - uses: actions/upload-artifact@v4
        with: { name: lab, path: lab.jsonl }
  opencl:
    needs: [lab]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: study-data-${{ github.run_id }}-${{ github.job }}
          restore-keys: study-data-
      - run: php tools/open-close-study.php 260 3 | tee oc.jsonl
      - uses: actions/upload-artifact@v4
        with: { name: oc, path: oc.jsonl }
  pro:
    needs: [opencl]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: study-data-${{ github.run_id }}-${{ github.job }}
          restore-keys: study-data-
      - run: php tools/pro-lab.php 10 | tee pro.jsonl
      - uses: actions/upload-artifact@v4
        with: { name: pro, path: pro.jsonl }
  learn:
    needs: [intraday, swing, lab, opencl, pro]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: study-data-${{ github.run_id }}-${{ github.job }}
          restore-keys: study-data-
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: results }
      - name: Decide what to keep
        run: |
          php tools/learn.php results/intraday/intraday.jsonl results/swing/swing.jsonl results/lab/lab.jsonl results/oc/oc.jsonl results/pro/pro.jsonl | tee decision.txt
          { echo "### Learning run"; echo '```'; cat decision.txt; echo '```'; echo '```json'; cat rules.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save rules.json
        run: |
          git config user.name "market-desk-learning"
          git config user.email "actions@users.noreply.github.com"
          git add rules.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Daily learning: $(cat decision.txt | head -c 200)"
          git push
