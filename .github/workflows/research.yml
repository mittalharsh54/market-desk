name: Research (volume study)

# Replays the live intraday rules on the last ~60 days of real 5-minute data,
# with and without the volume checks, so the rule is kept only if it helps.

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: "How many stocks from the universe"
        default: "260"
      grid:
        description: "Run the parameter grid instead of the volume comparison"
        type: boolean
        default: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Replay with and without volume rules
        run: |
          php -v | head -1
          php tools/volume-study.php "${{ inputs.stocks }}" 0 1 ${{ inputs.grid && 'grid' || '' }} | tee study.jsonl
          {
            echo "| Variant | Trades | Win % | Gross R/trade | Net R/trade | Net PF | Net R | 1st half | 2nd half |"
            echo "|---|---|---|---|---|---|---|---|---|"
            jq -r '"| \(.variant) | \(.trades) | \(.win_pct) | \(.gross_r_per_trade) | \(.net_r_per_trade) | \(.net_pf) | \(.net_r) | \(.half1_net_r) | \(.half2_net_r) |"' study.jsonl
          } >> "$GITHUB_STEP_SUMMARY"
