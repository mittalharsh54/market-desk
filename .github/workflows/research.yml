name: Research (strategy studies)

# Replays the live intraday rules on the last ~60 days of real 5-minute data,
# with and without the volume checks, so the rule is kept only if it helps.

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: "How many stocks from the universe"
        default: "260"
      years:
        description: "Years of history (lab default 4, pro default 10)"
        default: ""
      study:
        description: "Which study"
        type: choice
        options: [open-close, lab, pro, etf-swing, swing, intraday-grid, intraday-volume]
        default: open-close

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: study-data-${{ github.run_id }}-${{ github.job }}
          restore-keys: study-data-
      - name: Intraday replay
        if: inputs.study == 'intraday-grid' || inputs.study == 'intraday-volume'
        run: |
          php tools/volume-study.php "${{ inputs.stocks }}" 0 1 ${{ inputs.study == 'intraday-grid' && 'grid' || '' }} | tee study.jsonl
          {
            echo "| Variant | Trades | Win % | Gross R/trade | Net R/trade | Net PF | Net R | 1st half | 2nd half |"
            echo "|---|---|---|---|---|---|---|---|---|"
            jq -r '"| \(.variant) | \(.trades) | \(.win_pct) | \(.gross_r_per_trade) | \(.net_r_per_trade) | \(.net_pf) | \(.net_r) | \(.half1_net_r) | \(.half2_net_r) |"' study.jsonl
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Swing replay (3 years, delivery charges, Rs 10,000 account)
        if: inputs.study == 'swing'
        run: |
          php tools/swing-study.php "${{ inputs.stocks }}" 3 | tee study.jsonl
          { echo '```'; cat study.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Strategy lab (4 years, hold-out = last third, Rs 10,000 account)
        if: inputs.study == 'lab'
        run: |
          php tools/strategy-lab.php "${{ inputs.stocks }}" "${{ inputs.years || 4 }}" | tee study.jsonl
          { echo '```'; cat study.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Open-to-close hold of the Top 10 direction (3 years, hold-out = last third)
        if: inputs.study == 'open-close'
        run: |
          php tools/open-close-study.php "${{ inputs.stocks }}" 3 | tee study.jsonl
          { echo '```'; cat study.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Professional playbooks (10 years of index funds / ETFs / factor indices, hold-out = last third)
        if: inputs.study == 'pro'
        run: |
          php tools/pro-lab.php "${{ inputs.years || 10 }}" | tee study.jsonl
          {
            echo "| Strategy | Train CAGR | Train max fall | Hold-out CAGR | Hold-out max fall | Beats Nifty both | Safer both |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '"| \(.strategy) | \(.train.cagr_pct) | \(.train.max_dd_pct) | \(.holdout.cagr_pct) | \(.holdout.max_dd_pct) | \(.beats_nifty_both // "-") | \(.safer_than_nifty_both // "-") |"' study.jsonl
            echo '```'; cat study.jsonl; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: ETF swing (dip-buying rules on index ETFs, hold-out = last third)
        if: inputs.study == 'etf-swing'
        run: |
          php tools/etf-swing.php "${{ inputs.years || 15 }}" | tee study.jsonl
          {
            echo "| ETF | Rule | Train CAGR | Train trades / avg / PF | Hold-out CAGR | Hold-out trades / avg / PF | Passed |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '"| \(.asset) | \(.rule // "") | \(.train.cagr_pct // "") | \(.train.trades // "-") / \(.train.avg_net_pct // "-") / \(.train.pf // "-") | \(.holdout.cagr_pct // "") | \(.holdout.trades // "-") / \(.holdout.avg_net_pct // "-") / \(.holdout.pf // "-") | \(.passed // "-") |"' study.jsonl
          } >> "$GITHUB_STEP_SUMMARY"
